name: PR validation
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
permissions:
  contents: read
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-delta:
    uses: ./.github/workflows/android-delta-tests.yml
  validation:
    name: affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_TEST_TIER: pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:ci:policy
      - name: Check Android release Secret wiring and fail-closed preflight
        run: npm run test:android:auto
      - name: Test anonymous HTTP handling and collect runner-specific diagnostics for publisher changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --test scripts/android-web-http.test.mjs
          if ! git diff --quiet "$BASE_SHA" HEAD -- scripts/android-web-http.mjs scripts/android-web-auto.mjs; then
            node scripts/android-web-http.mjs probe android-web-shell-3-web-3
          fi
      - run: npx playwright install --with-deps chromium
      - name: Plan tests from the PR diff and critical-change labels
        run: node scripts/ci-plan.mjs
      - name: Build, smoke and affected module checks
        run: npm run test:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: validation-plan-${{ github.sha }}
          path: |
            ci-test-plan.json
            test-results/
            artifacts/ci-smoke-results/
            artifacts/cloudbase-test-results/
            artifacts/cloudbase-android-test-results/
            artifacts/android-web-http/
          if-no-files-found: warn

  verify:
    name: verify
    if: always()
    needs: [validation, native-delta]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable validation job to succeed
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          NATIVE_RESULT: ${{ needs.native-delta.result }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          assert.equal(process.env.VALIDATION_RESULT, 'success', 'Affected checks did not succeed');
          assert.equal(process.env.NATIVE_RESULT, 'success', 'Native scope and applicable ART checks did not succeed');
          JS
