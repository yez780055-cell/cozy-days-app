name: Signed Android APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android candidate versionCode
        required: true
        default: '2'
        type: string

permissions:
  contents: read

jobs:
  verify-signing:
    if: github.repository == 'yez780055-cell/cozy-days-app' && github.ref == 'refs/heads/release/android-formal-web-updates'
    runs-on: ubuntu-24.04
    environment: android-release
    timeout-minutes: 5
    steps:
      - name: Prove access to the original Android signer
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name}" || { echo "Missing signing credential: $name" >&2; exit 1; }
          done
          umask 077
          keydir="$(mktemp -d)"
          trap 'rm -f -- "$keydir/signer.jks" "$keydir/VerifySigner.java"; rmdir "$keydir"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keydir/signer.jks"
          unset ANDROID_KEYSTORE_BASE64
          cat > "$keydir/VerifySigner.java" <<'JAVA'
          import java.io.File;
          import java.security.*;
          import java.util.HexFormat;

          class VerifySigner {
              public static void main(String[] args) throws Exception {
                  var keys = KeyStore.getInstance(new File(args[0]), System.getenv("ANDROID_KEYSTORE_PASSWORD").toCharArray());
                  var alias = System.getenv("ANDROID_KEY_ALIAS");
                  var cert = keys.getCertificate(alias);
                  var fingerprint = HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256").digest(cert.getEncoded()));
                  if (!fingerprint.equals("c85fe70fff2425ad2b95d3dfa8f28ef7173027e744b03f57b721896fca40d3d8")) {
                      throw new GeneralSecurityException("Original signing certificate did not match");
                  }
                  var bytes = new byte[32];
                  new SecureRandom().nextBytes(bytes);
                  var signature = Signature.getInstance("SHA256withRSA");
                  signature.initSign((PrivateKey) keys.getKey(alias, System.getenv("ANDROID_KEY_PASSWORD").toCharArray()));
                  signature.update(bytes);
                  var signed = signature.sign();
                  signature.initVerify(cert);
                  signature.update(bytes);
                  if (!signature.verify(signed)) throw new GeneralSecurityException("Original private key challenge failed");
                  System.out.println("Verified original Android signer SHA-256: " + fingerprint);
              }
          }
          JAVA
          java "$keydir/VerifySigner.java" "$keydir/signer.jks"

