name: PR validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser interactions and capture current evidence
        run: npm run test:e2e
      - name: Build web app
        run: npm run build
      - name: Build GitHub Pages app
        run: npm run build:pages
      - name: Verify Pages build and mobile layouts
        run: npm run test:pages
      - name: Upload real browser evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.sha }}-evidence
          path: |
            public/review/evidence/
            test-results/
            artifacts/pages-*.png
            dist/review/build-info.json
          if-no-files-found: warn
          retention-days: 30
