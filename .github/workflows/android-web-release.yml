name: Android web package
run-name: Web ${{ inputs.web_revision }} - ${{ inputs.validation }}

on:
  workflow_dispatch:
    inputs:
      shell_code:
        description: APK shell (2 keeps legacy full-package support; 3 supports file updates)
        required: true
        default: '3'
        type: choice
        options: ['2', '3']
      web_revision:
        description: Monotonically increasing formal web revision
        required: true
        default: '2'
        type: string

      validation:
        description: Candidate artifact uses scoped tests; formal Release requires the complete gate
        required: true
        default: candidate
        type: choice
        options: [candidate, formal]
      changed_base:
        description: Optional base commit or tag; defaults to the latest published web tag
        required: false
        type: string
      full_regression:
        description: Force the full gate for critical features or architecture changes
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-web-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'yez780055-cell/cozy-days-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI_TEST_TIER: ${{ inputs.validation }}
      CI_CHANGE_BASE: ${{ inputs.changed_base }}
      CI_FULL: ${{ inputs.full_regression }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci:policy
      - name: Explain the selected validation scope
        run: node scripts/ci-plan.mjs
      - name: Validate this package at the selected tier
        run: npm run test:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-validation-plan
          path: ci-test-plan.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unified-tested-android-web
          path: dist-android/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: unified-release-failures
          path: |
            test-results/
            artifacts/cloudbase-test-results/

  sign-web:
    needs: verify
    runs-on: ubuntu-24.04
    environment: android-release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: unified-tested-android-web
          path: dist-android
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: web-validation-plan
          path: .
      - name: Sign one tested web package for the existing APK
        shell: bash
        env:
          VALIDATION_KIND: ${{ inputs.validation }}
          WEB_REVISION: ${{ inputs.web_revision }}
          SHELL_CODE: ${{ inputs.shell_code }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$SHELL_CODE" =~ ^[23]$ ]] || { echo 'Invalid shell' >&2; exit 1; }
          [[ "$WEB_REVISION" =~ ^[1-9][0-9]{0,8}$ ]] && (( WEB_REVISION >= 2 )) || { echo 'Invalid web revision' >&2; exit 1; }
          if [[ "$SHELL_CODE" == 2 ]]; then (( WEB_REVISION >= 9 )) || exit 1; fi
          if [[ "$VALIDATION_KIND" == formal ]]; then
            python3 -c 'import json; p=json.load(open("ci-test-plan.json")); assert p["tier"] == "formal" and p["full"], "Formal release requires the full gate"'
          fi
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/cozy-web-signer.jks"
          trap 'rm -f -- "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          java scripts/PackAndroidWeb.java dist-android "$SHELL_CODE" "$WEB_REVISION" "artifacts/Cozy-Days-Web-${SHELL_CODE}-${WEB_REVISION}.cozyupdate" artifacts/release
          cp "artifacts/release/shell-${SHELL_CODE}/latest.json" artifacts/latest.json
          sha256sum "artifacts/Cozy-Days-Web-${SHELL_CODE}-${WEB_REVISION}.cozyupdate" > artifacts/SHA256SUMS.txt
          printf 'source=%s\nshell=%s\nweb=%s\nchannel=stable\ncloudbase=true\nvalidation=%s\n' "$GITHUB_SHA" "$SHELL_CODE" "$WEB_REVISION" "$VALIDATION_KIND" > artifacts/provenance.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.validation == 'formal' && 'signed' || 'candidate' }}-web-shell-${{ inputs.shell_code }}-web-${{ inputs.web_revision }}
          path: |
            artifacts/release/shell-*/web-*/
            artifacts/latest.json
            artifacts/SHA256SUMS.txt
            artifacts/provenance.txt
            ci-test-plan.json
          if-no-files-found: error
          retention-days: 30
