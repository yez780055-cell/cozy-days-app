<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>纪念日素材验收图册 · Cozy Days</title>
  <style>
    :root { font: 15px/1.5 system-ui, sans-serif; color: #352e2b; background: #f7f2ed; }
    body { margin: 0; padding: 24px; }
    header { max-width: 1100px; margin: 0 auto 20px; }
    h1 { font-size: 1.7rem; margin: 0 0 6px; }
    .controls { display: flex; gap: 8px; margin: 16px 0; }
    button { border: 1px solid #bda99f; border-radius: 999px; background: white; padding: 8px 14px; cursor: pointer; }
    button[aria-pressed="true"] { background: #4b4541; color: white; }
    main { max-width: 1100px; margin: auto; display: grid; grid-template-columns: repeat(auto-fill,minmax(230px,1fr)); gap: 14px; }
    article { border: 1px solid #e2d7d0; border-radius: 16px; overflow: hidden; background: white; }
    .preview { height: 170px; display: grid; place-items: center; padding: 12px; background-color: #fff9f5; background-image: linear-gradient(45deg,#eadfd8 25%,transparent 25%),linear-gradient(-45deg,#eadfd8 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eadfd8 75%),linear-gradient(-45deg,transparent 75%,#eadfd8 75%); background-size: 20px 20px; background-position: 0 0,0 10px,10px -10px,-10px 0; }
    body[data-bg="dark"] .preview { background-color: #302b2a; background-image: linear-gradient(45deg,#494140 25%,transparent 25%),linear-gradient(-45deg,#494140 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#494140 75%),linear-gradient(-45deg,transparent 75%,#494140 75%); }
    .preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .crop { width: min(100%, 245px); max-height: 100%; display: grid; place-items: center; background-repeat: no-repeat; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 650; }
    .ready { color: #1b653b; background: #e5f5e9; }
    .redraw { color: #8b3c18; background: #ffeadc; }
    .meta { padding: 12px 14px 14px; }
    h2 { font-size: 1rem; margin: 0 0 6px; }
    p { margin: 4px 0; font-size: 13px; color: #645b56; }
    .warning { color: #8b3c18; font-weight: 600; }
    @media (max-width: 520px) { body { padding: 16px; } }
  </style>
</head>
<body data-bg="light">
  <header>
    <h1>纪念日素材验收图册</h1>
    <div>检查透明边缘，并快速识别待重绘项目。透明棋盘底色可切换浅色/深色。</div>
    <div class="controls" aria-label="预览底色">
      <button type="button" data-bg-button="light" aria-pressed="true">浅色底</button>
      <button type="button" data-bg-button="dark" aria-pressed="false">深色底</button>
    </div>
  </header>
  <main id="gallery" aria-live="polite"></main>
  <script type="module">
    const base = '../../assets/cozy_days/anniversary/';
    const source = './reference.png';
    const manifest = await fetch(`${base}manifest.json`).then(r => r.json());
    const gallery = document.querySelector('#gallery');
    for (const item of manifest.items) {
      const card = document.createElement('article');
      const preview = document.createElement('div'); preview.className = 'preview';
      if (item.file) {
        const img = document.createElement('img'); img.src = `${base}${item.file}`; img.alt = item.name; preview.append(img);
      } else if (item.crop) {
        const [x,y,w,h] = item.crop;
        const crop = document.createElement('div'); crop.className = 'crop'; crop.setAttribute('role','img'); crop.setAttribute('aria-label',`${item.name} 原图局部，待重绘`);
        crop.style.backgroundImage = `url("${source}")`;
        crop.style.aspectRatio = `${w} / ${h}`;
        crop.style.backgroundSize = `${852 * 100 / w}% auto`;
        crop.style.backgroundPosition = `${x * 100 / (852 - w)}% ${y * 100 / (1848 - h)}%`;
        const label = document.createElement('span'); label.className = 'badge redraw'; label.textContent = '原图局部 · 非透明素材'; crop.append(label); preview.append(crop);
      } else preview.textContent = '尚无可用素材';
      const meta = document.createElement('div'); meta.className = 'meta';
      const title = document.createElement('h2'); title.textContent = item.name;
      const state = document.createElement('span'); state.className = `badge ${item.quality === 'ready-reuse' ? 'ready' : 'redraw'}`; state.textContent = item.quality;
      const purpose = document.createElement('p'); purpose.textContent = item.purpose;
      const size = document.createElement('p'); size.textContent = `尺寸 / 格式：${item.size} · ${item.format}`;
      const quality = document.createElement('p'); quality.textContent = `透明检查：${item.transparent}`;
      const display = document.createElement('p'); display.textContent = `推荐显示：${item.display}`;
      meta.append(title, state, purpose, size, quality, display);
      if (item.note) { const note = document.createElement('p'); note.className = 'warning'; note.textContent = item.note; meta.append(note); }
      card.append(preview, meta); gallery.append(card);
    }
    document.querySelectorAll('[data-bg-button]').forEach(button => button.addEventListener('click', () => {
      document.body.dataset.bg = button.dataset.bgButton;
      document.querySelectorAll('[data-bg-button]').forEach(other => other.setAttribute('aria-pressed', String(other === button)));
    }));
  </script>
</body>
</html>
