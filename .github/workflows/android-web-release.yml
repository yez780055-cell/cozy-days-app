name: Signed Android web release

on:
  workflow_dispatch:
    inputs:
      web_revision:
        description: Monotonically increasing formal web revision
        required: true
        default: '9'
        type: string

permissions:
  contents: read

concurrency:
  group: android-web-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'yez780055-cell/cozy-days-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Existing data and interaction regressions
        run: |
          VITE_CLOUDBASE_ENABLED=false npm run build
          VITE_CLOUDBASE_ENABLED=false npm run build:pages
          VITE_CLOUDBASE_ENABLED=false npm run build:android
          npm run test:e2e -- --reporter=line
          npm run test:pages -- --reporter=line
          npx playwright test --config playwright.android.config.ts --reporter=line
      - name: CloudBase registration, sharing, conflicts and offline regressions
        run: npm run test:cloudbase -- --reporter=line
      - name: Build and verify the unified Android resources
        run: |
          npm run build:android
          npx playwright test --config playwright.cloudbase.android.config.ts --reporter=line
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unified-tested-android-web
          path: dist-android/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: unified-release-failures
          path: |
            test-results/
            artifacts/cloudbase-test-results/

  sign-web:
    needs: verify
    runs-on: ubuntu-24.04
    environment: android-release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: unified-tested-android-web
          path: dist-android
      - name: Sign one formal web update for the existing APK
        shell: bash
        env:
          WEB_REVISION: ${{ inputs.web_revision }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$WEB_REVISION" =~ ^[1-9][0-9]{0,8}$ ]] && (( WEB_REVISION >= 9 )) || { echo 'Invalid web revision' >&2; exit 1; }
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/cozy-web-signer.jks"
          trap 'rm -f -- "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          java scripts/PackAndroidWeb.java dist-android 2 "$WEB_REVISION" "artifacts/Cozy-Days-Web-2-${WEB_REVISION}.cozyupdate" artifacts/release
          cp artifacts/release/shell-2/latest.json artifacts/latest.json
          sha256sum "artifacts/Cozy-Days-Web-2-${WEB_REVISION}.cozyupdate" > artifacts/SHA256SUMS.txt
          printf 'source=%s\nshell=2\nweb=%s\nchannel=stable\ncloudbase=true\n' "$GITHUB_SHA" "$WEB_REVISION" > artifacts/provenance.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signed-web-shell-2-web-${{ inputs.web_revision }}
          path: |
            artifacts/Cozy-Days-Web-2-${{ inputs.web_revision }}.cozyupdate
            artifacts/latest.json
            artifacts/SHA256SUMS.txt
            artifacts/provenance.txt
          if-no-files-found: error
          retention-days: 30
