name: Android delta native tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - id: scope
        name: Plan ART scope from the shared dependency policy
        env:
          CI_TEST_TIER: pr
          CI_FULL: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
        run: node scripts/ci-plan.mjs
  delta:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Run production updater tests on disposable Android ART
        env:
          ANDROID_SERIAL: emulator-5554
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'system-images;android-35;default;x86_64'
          echo no | avdmanager create avd --name delta --package 'system-images;android-35;default;x86_64'
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd delta -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          timeout 180 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done'
          npm run test:android:delta

  result:
    if: always()
    needs: [scope, delta]
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on invalid scope or missing applicable ART result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          NATIVE_REQUIRED: ${{ needs.scope.outputs.native }}
          DELTA_RESULT: ${{ needs.delta.result }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          assert.equal(process.env.SCOPE_RESULT, 'success', 'Native scope did not succeed');
          assert.ok(['true', 'false'].includes(process.env.NATIVE_REQUIRED), 'Native scope is missing or invalid');
          assert.equal(process.env.DELTA_RESULT, process.env.NATIVE_REQUIRED === 'true' ? 'success' : 'skipped',
            'Applicable ART tests must succeed; only explicitly inapplicable tests may skip');
          JS
