name: Signed Android device test only
on:
  workflow_dispatch:
    inputs:
      apk_source:
        description: Accepted APK source; production files must be unchanged
        required: true
        default: '8e8dac775a6b95aa03e3d422b3a0187f10d3dee5'
permissions:
  contents: read
jobs:
  test-apk:
    if: github.repository == 'yez780055-cell/cozy-days-app' && startsWith(github.ref, 'refs/heads/release/android-')
    runs-on: ubuntu-24.04
    environment: android-release
    timeout-minutes: 15
    env:
      ANDROID_VERSION_CODE: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require unchanged accepted production code
        env:
          APK_SOURCE: ${{ inputs.apk_source }}
        run: |
          [[ "$APK_SOURCE" =~ ^[a-f0-9]{40}$ ]] || exit 1
          unexpected=$(git diff --name-only "$APK_SOURCE" HEAD | grep -vE '^(android/app/src/androidTest/|\.github/workflows/|docs/)' || true)
          [[ -z "$unexpected" ]] || { printf '%s\n' "$unexpected"; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci && npm run build:android && npx cap sync android
      - name: Build only the test APK with the original signer
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/device-test-signer.jks"
          trap 'rm -f -- "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64 COZY_ANDROID_WEB_UPDATE_ROOT COZY_ANDROID_WEB_UPDATE_QA_CA
          bash android/gradlew -p android --no-daemon --console=plain :app:assembleReleaseAndroidTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signed-device-test-apk
          path: android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          if-no-files-found: error
          retention-days: 1
