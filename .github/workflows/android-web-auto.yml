name: Publish deployed Android web

# Only the successful Pages deployment may call this workflow. No PR/signing trigger.
on:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: android-web-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      web: ${{ steps.plan.outputs.web }}
      published: ${{ steps.plan.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - id: plan
        name: Reserve a monotonic shell 3 revision (including existing drafts and tags)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/android-web-auto.mjs plan
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci:policy && npm run test:android:auto && npm run test:android:pack
      - name: Build and validate the deployed commit with focused Android update checks
        env:
          CI_TEST_TIER: candidate
          CI_CHANGE_BASE: ${{ steps.plan.outputs.base }}
          VITE_CLOUDBASE_ENABLED: 'true'
        run: npm run test:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deployed-tested-android-web
          path: |
            dist-android/
            android-web-auto-plan.json
            ci-test-plan.json
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: deployed-android-web-failures
          path: |
            ci-test-plan.json
            test-results/
            artifacts/ci-smoke-results/
            artifacts/cloudbase-android-test-results/
          if-no-files-found: warn

  sign:
    needs: verify
    runs-on: ubuntu-24.04
    environment: android-release
    timeout-minutes: 10
    steps:
      - name: Require all four signing Secrets before accessing key material
        if: needs.verify.outputs.published != 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing signing credential: $name" >&2; exit 1; }
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: deployed-tested-android-web
          path: tested
      - name: Resume an already public release without changing its bytes
        if: needs.verify.outputs.published == 'true'
        run: node scripts/android-web-auto.mjs restore tested signed
      - name: Sign the tested bytes with the original APK key and verify both signatures
        if: needs.verify.outputs.published != 'true'
        shell: bash
        env:
          WEB_REVISION: ${{ needs.verify.outputs.web }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing signing credential: $name" >&2; exit 1; }
          done
          umask 077
          keydir="$(mktemp -d)"
          export ANDROID_KEYSTORE_PATH="$keydir/signer.jks"
          trap 'rm -f -- "$ANDROID_KEYSTORE_PATH"; rmdir "$keydir"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          java scripts/PackAndroidWeb.java tested/dist-android 3 "$WEB_REVISION" "$RUNNER_TEMP/update.cozyupdate" signed
          keytool -exportcert -alias "$ANDROID_KEY_ALIAS" -keystore "$ANDROID_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD -file signed/signer.cer
          cp signed/shell-3/latest.json "signed/shell-3/web-${WEB_REVISION}/latest.json"
          cp tested/{android-web-auto-plan,ci-test-plan}.json signed/
          node scripts/android-web-auto.mjs seal signed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deployed-signed-android-web
          path: signed/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: deployed-signed-android-web
          path: signed
      - name: Verify every draft asset, publish stable, then verify anonymous APK downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/android-web-auto.mjs publish signed
      - name: Preserve complete anonymous HTTP diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-publish-http-diagnostics
          path: artifacts/android-web-http/
          if-no-files-found: warn
          retention-days: 14
