name: Signed Android APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android candidate versionCode
        required: true
        default: '3'
        type: string
      sign_qa_fixtures:
        description: Include signed fixture bundles for isolated device QA
        default: false
        type: boolean
      full_regression:
        description: Explicitly opt in to full regression; default validates builds, update paths and smoke only
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  native-delta:
    uses: ./.github/workflows/android-delta-tests.yml
  web-regression:
    if: github.repository == 'yez780055-cell/cozy-days-app' && startsWith(github.ref, 'refs/heads/release/android-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Necessary build, smoke and Android update checks
        if: ${{ !inputs.full_regression }}
        run: |
          npm run build
          npm run test:smoke -- --reporter=line
          VITE_CLOUDBASE_ENABLED=false npm run build:android
          PLAYWRIGHT_JSON_OUTPUT_FILE=artifacts/android-web-e2e.json npx playwright test --config playwright.android.config.ts web-update.spec.ts --reporter=line,json
          npm run build:android
          npx playwright test --config playwright.cloudbase.android.config.ts --grep 'unified Android' --reporter=line
      - run: VITE_CLOUDBASE_ENABLED=false npm run build && VITE_CLOUDBASE_ENABLED=false npm run build:pages && VITE_CLOUDBASE_ENABLED=false npm run build:android
        if: inputs.full_regression
      - name: Full Web E2E and Android UI tests
        if: inputs.full_regression
        run: |
          export PLAYWRIGHT_REVIEW_EVIDENCE_DIR=artifacts/review-evidence
          PLAYWRIGHT_JSON_OUTPUT_FILE=artifacts/web-e2e.json npm run test:e2e -- --reporter=line,json
          PLAYWRIGHT_JSON_OUTPUT_FILE=artifacts/android-web-e2e.json npx playwright test --config playwright.android.config.ts --reporter=line,json
          PLAYWRIGHT_JSON_OUTPUT_FILE=artifacts/pages-e2e.json npm run test:pages -- --reporter=line,json
      - name: Verify unified login, sync and Android update integration
        if: inputs.full_regression
        run: |
          npm run test:cloudbase -- --reporter=line
          npm run build:android
          npx playwright test --config playwright.cloudbase.android.config.ts --reporter=line
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: formal-web-regression
          path: |
            artifacts/*-e2e.json
            artifacts/review-evidence/
            test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: formal-tested-web
          path: dist-android/
          if-no-files-found: error
          retention-days: 1

  verify-signing:
    if: github.repository == 'yez780055-cell/cozy-days-app' && startsWith(github.ref, 'refs/heads/release/android-')
    runs-on: ubuntu-24.04
    environment: android-release
    timeout-minutes: 5
    steps:
      - name: Prove access to the original Android signer
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name}" || { echo "Missing signing credential: $name" >&2; exit 1; }
          done
          umask 077
          keydir="$(mktemp -d)"
          trap 'rm -f -- "$keydir/signer.jks" "$keydir/VerifySigner.java"; rmdir "$keydir"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keydir/signer.jks"
          unset ANDROID_KEYSTORE_BASE64
          cat > "$keydir/VerifySigner.java" <<'JAVA'
          import java.io.File;
          import java.security.*;
          import java.util.HexFormat;

          class VerifySigner {
              public static void main(String[] args) throws Exception {
                  var keys = KeyStore.getInstance(new File(args[0]), System.getenv("ANDROID_KEYSTORE_PASSWORD").toCharArray());
                  var alias = System.getenv("ANDROID_KEY_ALIAS");
                  var cert = keys.getCertificate(alias);
                  var fingerprint = HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256").digest(cert.getEncoded()));
                  if (!fingerprint.equals("c85fe70fff2425ad2b95d3dfa8f28ef7173027e744b03f57b721896fca40d3d8")) {
                      throw new GeneralSecurityException("Original signing certificate did not match");
                  }
                  var bytes = new byte[32];
                  new SecureRandom().nextBytes(bytes);
                  var signature = Signature.getInstance("SHA256withRSA");
                  signature.initSign((PrivateKey) keys.getKey(alias, System.getenv("ANDROID_KEY_PASSWORD").toCharArray()));
                  signature.update(bytes);
                  var signed = signature.sign();
                  signature.initVerify(cert);
                  signature.update(bytes);
                  if (!signature.verify(signed)) throw new GeneralSecurityException("Original private key challenge failed");
                  System.out.println("Verified original Android signer SHA-256: " + fingerprint);
              }
          }
          JAVA
          java "$keydir/VerifySigner.java" "$keydir/signer.jks"

  signed-apk:
    if: github.repository == 'yez780055-cell/cozy-days-app' && startsWith(github.ref, 'refs/heads/release/android-')
    needs: [web-regression, verify-signing, native-delta]
    runs-on: ubuntu-24.04
    environment: android-release
    timeout-minutes: 35
    env:
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      SIGN_QA_FIXTURES: ${{ inputs.sign_qa_fixtures }}
      APK_VALIDATION: ${{ inputs.full_regression && 'full' || 'focused' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: formal-tested-web
          path: dist-android
      - run: npx cap sync android
      - name: Build one release candidate and sign isolated test fixtures
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/little-days-release.jks"
          trap 'rm -f -- "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64 COZY_ANDROID_WEB_UPDATE_ROOT COZY_ANDROID_WEB_UPDATE_QA_CA
          bash android/gradlew -p android --no-daemon --console=plain :app:assembleRelease :app:assembleReleaseAndroidTest
          mkdir -p artifacts/formal-apk artifacts/formal-fixtures
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/formal-apk/Cozy-Days-Android-0.2.3-${ANDROID_VERSION_CODE}.apk"
          cp android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk artifacts/formal-fixtures/
          if [[ "$SIGN_QA_FIXTURES" != true ]]; then exit 0; fi
          cp -a dist-android "$RUNNER_TEMP/fixture-web"
          for revision in 2 3; do
            cp dist-android/index.html "$RUNNER_TEMP/fixture-web/index.html"
            printf '\n<!-- isolated delta QA revision %s -->\n' "$revision" >> "$RUNNER_TEMP/fixture-web/index.html"
            java scripts/PackAndroidWeb.java "$RUNNER_TEMP/fixture-web" "$ANDROID_VERSION_CODE" "$revision" \
              "artifacts/formal-fixtures/Cozy-Days-Web-${ANDROID_VERSION_CODE}-${revision}.cozyupdate" artifacts/formal-fixtures/releases
          done
          mkdir -p "$RUNNER_TEMP/unready"/{assets,icons}
          printf '<!doctype html><title>QA</title><p>Trial without a startup handshake</p>' > "$RUNNER_TEMP/unready/index.html"
          java scripts/PackAndroidWeb.java "$RUNNER_TEMP/unready" "$ANDROID_VERSION_CODE" 4 artifacts/formal-fixtures/local-web-4.cozyupdate
          java scripts/PackAndroidWeb.java dist-android "$ANDROID_VERSION_CODE" 5 artifacts/formal-fixtures/local-web-5.cozyupdate
      - name: Verify formal certificate, offline bundle, package and checksum
        run: |
          python3 scripts/android-verify-apk.py "artifacts/formal-apk/Cozy-Days-Android-0.2.3-${ANDROID_VERSION_CODE}.apk" --output artifacts/formal-apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: formal-apk
          path: artifacts/formal-apk/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.sign_qa_fixtures
        with:
          name: formal-device-fixtures
          path: |
            artifacts/formal-fixtures/releases/
            artifacts/formal-fixtures/local-web-*.cozyupdate
            artifacts/formal-fixtures/app-release-androidTest.apk
          if-no-files-found: error
          retention-days: 1
